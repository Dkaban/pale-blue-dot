name: Refresh data and publish dashboard
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pale-blue-dot-pages
  cancel-in-progress: false
jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh public datasets
        run: python scripts/update_data.py
      - name: Commit updated snapshots
        run: |
          if ! git diff --quiet -- data/history.json data/launches.json data/countries.json data/year-launches.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/history.json data/launches.json data/countries.json data/year-launches.json
            git commit -m "data: refresh space activity feeds"
            git push
          fi
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
